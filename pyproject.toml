[project]
name = "market-narrative-agent"
version = "0.1.0"
description = "An intelligent agent that analyzes market movements and generates daily narratives"
authors = [
    {name = "Mike Zhu", email = "mike.zhu888@gmail.com"}
]
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    # Agent & LLM
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-anthropic>=0.1.0",
    "langgraph>=0.0.20",

    # Data collection
    "yfinance>=0.2.40",
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.3",

    # Data processing
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.9.0",

    # Storage
    "aiosqlite>=0.20.0",

    # Utilities
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "tenacity>=9.0.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "ipython>=8.12.0,<8.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
